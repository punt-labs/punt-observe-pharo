name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make setup
      - run: make start-headless
      - run: make lint
      - if: always()
        run: make stop
